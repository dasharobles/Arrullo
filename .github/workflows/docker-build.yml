name: Docker image

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build Arrullo image
        run: docker build --tag arrullo:ci --file tienda-online/Dockerfile tienda-online
